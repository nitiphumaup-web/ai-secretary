<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AI Secretary Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f5f6fa;--bg2:#ffffff;--bg3:#f0f1f5;--bg4:#e4e6ed;--bg5:#d8dae3;
  --border:rgba(0,0,0,0.07);--border2:rgba(0,0,0,0.11);--border3:rgba(0,0,0,0.20);
  --text:#1a1a2e;--text2:#5a5a78;--text3:#9898b0;
  --accent:#6c63ff;--accent-soft:rgba(108,99,255,0.10);--accent2:#5048e5;
  --green:#16a86a;--green-soft:rgba(22,168,106,0.10);
  --amber:#d4890a;--amber-soft:rgba(212,137,10,0.10);
  --red:#e03e3e;--red-soft:rgba(224,62,62,0.10);
  --blue:#2e80d8;--blue-soft:rgba(46,128,216,0.10);
  --r:10px;--r-sm:7px;
  --shadow:0 1px 4px rgba(0,0,0,0.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Sarabun',sans-serif;font-size:15px;overflow:hidden;}
.app{display:flex;height:100vh;}

/* ── SIDEBAR ── */
.sidebar{width:290px;min-width:290px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:transform 0.3s;box-shadow:var(--shadow);}
.sb-head{padding:16px 16px 12px;border-bottom:1px solid var(--border);}
.sb-logo{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
.sb-logo-icon{width:32px;height:32px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.sb-logo h1{font-size:15px;font-weight:700;letter-spacing:-.3px;color:var(--text);}
.sb-logo small{font-size:10px;color:var(--text3);display:block;}
.sb-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.date-chip{background:var(--bg3);border:1px solid var(--border);border-radius:99px;padding:3px 10px;font-size:11px;color:var(--text2);}
.sync-btn{background:var(--bg3);border:1px solid var(--border);border-radius:99px;padding:3px 10px;font-size:11px;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:4px;font-family:inherit;transition:all .15s;}
.sync-btn:hover{border-color:var(--accent);color:var(--accent);}
.sync-btn.syncing{color:var(--amber);border-color:var(--amber);animation:pulse 1s infinite;}
.sync-btn.ok{color:var(--green);border-color:var(--green);}
.sync-btn.err{color:var(--red);border-color:var(--red);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* SETUP BANNER */
.setup-banner{background:var(--amber-soft);border:1px solid var(--amber);border-radius:var(--r-sm);padding:10px 12px;margin:10px;font-size:12px;color:var(--amber);display:none;}
.setup-banner.show{display:block;}
.setup-banner a{color:var(--amber);font-weight:600;}
.setup-banner input{width:100%;margin-top:6px;padding:5px 8px;border:1px solid var(--amber);border-radius:5px;font-size:12px;font-family:inherit;background:#fff;color:var(--text);outline:none;}
.setup-banner button{margin-top:6px;padding:4px 10px;background:var(--amber);color:#fff;border:none;border-radius:5px;font-size:12px;cursor:pointer;font-family:inherit;}

/* STATS */
.sb-stats{padding:12px 14px;border-bottom:1px solid var(--border);}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.stat-card{background:var(--bg3);border-radius:var(--r-sm);padding:9px 11px;border:1px solid var(--border);}
.stat-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px;}
.stat-val{font-size:21px;font-weight:700;color:var(--text);line-height:1;}
.stat-val.g{color:var(--green);}.stat-val.a{color:var(--amber);}.stat-val.r{color:var(--red);}
.prog-wrap{margin-top:9px;}
.prog-bar{height:4px;background:var(--bg4);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:99px;transition:width .5s ease;}
.prog-txt{font-size:11px;color:var(--text3);margin-top:4px;}

/* TABS */
.sb-tabs{display:flex;padding:10px 12px 0;gap:4px;border-bottom:1px solid var(--border);}
.tab-btn{flex:1;padding:6px 4px;font-size:11px;font-weight:600;font-family:inherit;background:none;border:none;border-bottom:2px solid transparent;color:var(--text3);cursor:pointer;transition:all .15s;}
.tab-btn.active{color:var(--accent);border-color:var(--accent);}

/* CONTENT */
.sb-content{flex:1;overflow-y:auto;padding:6px;}
.sb-content::-webkit-scrollbar{width:3px;}
.sb-content::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:99px;}
.add-row{display:flex;gap:6px;padding:8px 6px 6px;}
.add-row input{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r-sm);padding:7px 10px;color:var(--text);font-size:13px;font-family:inherit;outline:none;}
.add-row input:focus{border-color:var(--accent);background:#fff;}
.add-row input::placeholder{color:var(--text3);}
.btn-add{background:var(--accent);color:#fff;border:none;border-radius:var(--r-sm);padding:7px 13px;font-size:17px;cursor:pointer;transition:background .15s;}
.btn-add:hover{background:var(--accent2);}
.prio-row{display:flex;gap:5px;padding:0 6px 6px;}
.pr-btn{flex:1;padding:4px;font-size:11px;font-family:inherit;border-radius:5px;border:1px solid var(--border);background:var(--bg3);color:var(--text3);cursor:pointer;transition:all .12s;text-align:center;}
.pr-btn.sel-high{background:var(--red-soft);border-color:var(--red);color:var(--red);}
.pr-btn.sel-mid{background:var(--amber-soft);border-color:var(--amber);color:var(--amber);}
.pr-btn.sel-low{background:var(--green-soft);border-color:var(--green);color:var(--green);}
.deadline-row{display:flex;gap:5px;padding:0 6px 8px;}
.deadline-row input,.proj-select{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r-sm);padding:5px 8px;color:var(--text2);font-size:12px;font-family:inherit;outline:none;}
.deadline-row input:focus,.proj-select:focus{border-color:var(--accent);}
.grp-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;font-weight:700;padding:7px 5px 3px;display:flex;align-items:center;justify-content:space-between;}
.grp-count{background:var(--bg4);border-radius:99px;padding:1px 7px;font-size:10px;}
.task-item{display:flex;align-items:flex-start;gap:7px;padding:8px;border-radius:var(--r-sm);margin-bottom:3px;transition:background .12s;border:1px solid transparent;background:var(--bg2);}
.task-item:hover{background:var(--bg3);border-color:var(--border);}
.task-item.overdue{border-left:3px solid var(--red)!important;background:var(--red-soft);}
.task-item.due-today{border-left:3px solid var(--amber)!important;background:var(--amber-soft);}
.cb{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border3);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .15s;cursor:pointer;}
.cb.done{background:var(--green);border-color:var(--green);}
.cb.done::after{content:'✓';font-size:9px;color:#fff;font-weight:700;}
.task-body{flex:1;min-width:0;}
.task-txt{font-size:13px;line-height:1.4;color:var(--text);word-break:break-word;}
.task-txt.x{text-decoration:line-through;color:var(--text3);}
.task-meta{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap;align-items:center;}
.tag{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;}
.tag-high{background:var(--red-soft);color:var(--red);}
.tag-mid{background:var(--amber-soft);color:var(--amber);}
.tag-low{background:var(--green-soft);color:var(--green);}
.tag-proj{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:500;}
.tag-dl{font-size:10px;color:var(--text3);}
.tag-dl.late{color:var(--red);font-weight:600;}
.tag-dl.soon{color:var(--amber);font-weight:600;}
.btn-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;opacity:0;transition:opacity .12s;padding:0;flex-shrink:0;}
.task-item:hover .btn-del{opacity:1;}
.btn-del:hover{color:var(--red);}
.empty-state{text-align:center;color:var(--text3);font-size:12px;padding:24px 0;line-height:2.2;}

/* PROJECT PANEL */
.proj-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:var(--r-sm);margin-bottom:4px;background:var(--bg2);border:1px solid var(--border);box-shadow:var(--shadow);}
.proj-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.proj-name{flex:1;font-size:13px;font-weight:500;}
.proj-progress{font-size:11px;color:var(--text3);}
.btn-del-proj{background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;opacity:0;transition:opacity .12s;padding:0;}
.proj-item:hover .btn-del-proj{opacity:1;}
.add-proj-row{display:flex;gap:6px;padding:8px 6px 4px;}
.add-proj-row input{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r-sm);padding:6px 9px;color:var(--text);font-size:12px;font-family:inherit;outline:none;}
.color-pick{display:flex;gap:5px;padding:0 6px 8px;flex-wrap:wrap;}
.cp{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .12s;flex-shrink:0;}
.cp.sel{border-color:var(--text);}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
.main-head{padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg2);box-shadow:var(--shadow);}
.main-head-title{font-size:13px;color:var(--text2);font-weight:500;}
.burger{display:none;background:none;border:none;color:var(--text2);font-size:22px;cursor:pointer;padding:4px;}
.chat-wrap{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;}
.chat-wrap::-webkit-scrollbar{width:4px;}
.chat-wrap::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:99px;}
.msg{display:flex;gap:9px;max-width:720px;animation:fadeUp .2s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;flex-direction:row-reverse;}
.msg-av{width:30px;height:30px;border-radius:50%;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:var(--shadow);}
.msg.ai .msg-av{background:var(--accent);}
.msg.user .msg-av{background:var(--bg4);}
.msg-inner{display:flex;flex-direction:column;}
.msg-bubble{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:11px 15px;font-size:14px;line-height:1.75;color:var(--text);max-width:560px;word-break:break-word;box-shadow:var(--shadow);}
.msg.user .msg-bubble{background:var(--accent);border-color:var(--accent2);color:#fff;border-radius:14px 4px 14px 14px;}
.msg.ai .msg-bubble{border-radius:4px 14px 14px 14px;}
.msg-time{font-size:11px;color:var(--text3);margin-top:4px;padding:0 3px;}
.msg.user .msg-time{text-align:right;}
.typing-dots{display:flex;gap:4px;padding:3px 0;}
.typing-dots span{width:6px;height:6px;background:var(--text3);border-radius:50%;animation:dot 1.2s infinite;}
.typing-dots span:nth-child(2){animation-delay:.2s;}
.typing-dots span:nth-child(3){animation-delay:.4s;}
@keyframes dot{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
.reminder-chip{background:var(--amber-soft);border:1px solid var(--amber);border-radius:9px;padding:9px 13px;font-size:13px;color:var(--amber);display:flex;align-items:center;gap:8px;max-width:500px;animation:fadeUp .3s ease;}
.reminder-chip button{background:none;border:none;color:var(--amber);cursor:pointer;font-size:16px;padding:0;margin-left:auto;}

/* INPUT */
.input-area{padding:12px 20px 16px;border-top:1px solid var(--border);flex-shrink:0;background:var(--bg2);}
.input-box{display:flex;gap:8px;align-items:flex-end;background:var(--bg3);border:1px solid var(--border2);border-radius:14px;padding:10px 13px;transition:border-color .15s;}
.input-box:focus-within{border-color:var(--accent);background:#fff;}
.chat-ta{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px;font-family:inherit;resize:none;max-height:110px;line-height:1.6;}
.chat-ta::placeholder{color:var(--text3);}
.btn-send{background:var(--accent);border:none;border-radius:9px;width:36px;height:36px;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0;box-shadow:0 2px 8px rgba(108,99,255,0.3);}
.btn-send:hover{background:var(--accent2);}
.btn-send:disabled{background:var(--bg4);cursor:default;box-shadow:none;}
.quick-chips{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
.qc{background:var(--bg3);border:1px solid var(--border2);border-radius:99px;padding:4px 12px;font-size:12px;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .12s;white-space:nowrap;}
.qc:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}

@media(max-width:700px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:100;transform:translateX(-100%);box-shadow:4px 0 24px rgba(0,0,0,.15);}
  .sidebar.open{transform:translateX(0);}
  .burger{display:flex;}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:99;}
  .overlay.show{display:block;}
  .chat-wrap{padding:14px;}
  .input-area{padding:10px 14px 14px;}
}
.hi{color:var(--accent);font-weight:600;}
.hi-g{color:var(--green);font-weight:600;}
.hi-a{color:var(--amber);}
.hi-r{color:var(--red);}
b{font-weight:600;}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<div class="app">

<!-- ══ SIDEBAR ══ -->
<div class="sidebar" id="sidebar">
  <div class="sb-head">
    <div class="sb-logo">
      <div class="sb-logo-icon">🤖</div>
      <div><h1>AI Secretary Pro</h1><small>☁️ Google Sheet + Gemini AI</small></div>
    </div>
    <div class="sb-meta">
      <div class="date-chip" id="date-chip"></div>
      <button class="sync-btn" id="sync-btn" onclick="syncNow()">
        <span id="sync-label">☁️ ซิงค์</span>
      </button>
      <button class="sync-btn" onclick="toggleSettings()" title="ตั้งค่า">⚙️</button>
    </div>
  </div>

  <!-- SETUP BANNER -->
  <div class="setup-banner" id="setup-banner">
    ⚙️ <b>ตั้งค่า API</b><br>
    1. <a href="https://aistudio.google.com/apikey" target="_blank">กดที่นี่ → ขอ Gemini API Key ฟรี</a><br>
    2. วาง Script URL และ API Key ด้านล่าง:
    <input id="script-url-inp" placeholder="https://script.google.com/macros/s/.../exec" />
    <input id="api-key-inp" placeholder="Gemini API Key: AIza..." style="margin-top:4px;" />
    <button onclick="saveConfig()">💾 บันทึก</button>
    <button onclick="toggleSettings()" style="background:var(--bg4);color:var(--text);margin-left:4px;">✕ ปิด</button>
  </div>

  <div class="sb-stats">
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">ทั้งหมด</div><div class="stat-val" id="s-total">0</div></div>
      <div class="stat-card"><div class="stat-label">รอทำ</div><div class="stat-val a" id="s-pend">0</div></div>
      <div class="stat-card"><div class="stat-label">เสร็จแล้ว</div><div class="stat-val g" id="s-done">0</div></div>
      <div class="stat-card"><div class="stat-label">เกินกำหนด</div><div class="stat-val r" id="s-late">0</div></div>
    </div>
    <div class="prog-wrap">
      <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
      <div class="prog-txt" id="prog-txt">กำลังโหลด...</div>
    </div>
  </div>

  <div class="sb-tabs">
    <button class="tab-btn active" id="tab-tasks" onclick="switchTab('tasks')">📋 งาน</button>
    <button class="tab-btn" id="tab-projects" onclick="switchTab('projects')">📁 โปรเจกต์</button>
    <button class="tab-btn" id="tab-done" onclick="switchTab('done')">✅ เสร็จ</button>
  </div>

  <div id="panel-tasks" class="sb-content">
    <div class="add-row">
      <input id="task-inp" placeholder="ชื่องาน..." />
      <button class="btn-add" onclick="addTaskUI()">+</button>
    </div>
    <div class="prio-row">
      <button class="pr-btn sel-high" id="pr-high" onclick="selPrio('high')">🔴 สำคัญ</button>
      <button class="pr-btn" id="pr-mid" onclick="selPrio('mid')">🟡 กลาง</button>
      <button class="pr-btn" id="pr-low" onclick="selPrio('low')">🟢 ต่ำ</button>
    </div>
    <div class="deadline-row">
      <input type="date" id="dl-inp" />
      <select class="proj-select" id="proj-sel"><option value="">📂 ไม่ระบุโปรเจกต์</option></select>
    </div>
    <div id="task-list-wrap"></div>
  </div>

  <div id="panel-projects" class="sb-content" style="display:none">
    <div class="add-proj-row">
      <input id="proj-inp" placeholder="ชื่อโปรเจกต์ใหม่..." />
      <button class="btn-add" onclick="addProjectUI()">+</button>
    </div>
    <div class="color-pick" id="color-pick"></div>
    <div id="proj-list-wrap"></div>
  </div>

  <div id="panel-done" class="sb-content" style="display:none">
    <div id="done-list-wrap"></div>
  </div>
</div>

<!-- ══ MAIN CHAT ══ -->
<div class="main">
  <div class="main-head">
    <button class="burger" onclick="openSidebar()">☰</button>
    <span class="main-head-title">💬 แชทกับ AI Secretary</span>
    <span id="conn-status" style="font-size:11px;color:var(--text3)">⏳ กำลังโหลด...</span>
  </div>
  <div class="chat-wrap" id="chat-wrap"></div>
  <div class="input-area">
    <div class="input-box">
      <textarea class="chat-ta" id="chat-ta" rows="1"
        placeholder="บอก AI ได้เลย เช่น 'สร้างโปรเจกต์สำนวนคดีที่ 7 พร้อมงาน 4 อย่าง' หรือ 'สอบปากคำเสร็จแล้ว'...">
      </textarea>
      <button class="btn-send" id="btn-send" onclick="sendMsg()">↑</button>
    </div>
    <div class="quick-chips">
      <button class="qc" onclick="qs('วันนี้มีงานอะไรบ้าง ควรทำอะไรก่อน?')">📋 งานวันนี้</button>
      <button class="qc" onclick="qs('มีงานใกล้เกินกำหนดไหม?')">⏰ งานใกล้หมด</button>
      <button class="qc" onclick="qs('ช่วยจัดลำดับงานที่ค้างทั้งหมด')">🎯 จัดลำดับ</button>
      <button class="qc" onclick="qs('สรุปความคืบหน้าทุกโปรเจกต์')">📁 สรุปโปรเจกต์</button>
      <button class="qc" onclick="qs('สรุปงานที่ทำเสร็จวันนี้')">✅ สรุปวันนี้</button>
    </div>
  </div>
</div>
</div>

<script>
// ══════════════════════════════════════
//  CONFIG (เก็บใน localStorage)
// ══════════════════════════════════════
// ══ ตั้งค่าตรงนี้เลย ══
let SCRIPT_URL = localStorage.getItem('aisec-script-url') || 'https://script.google.com/macros/s/AKfycbyGsLquMnb7s9qo3VVcPEzh1cuVs24ioLAlCRNEsZb2NHHbv9mLO_YJTGsDqgxg3Hr4mQ/exec';
let API_KEY    = localStorage.getItem('aisec-api-key') || 'AIzaSyB7TsALmyz8MxUt4eAoapcNdDRNqslsvag';
const MODEL    = 'gemini-2.0-flash';
function geminiURL() { return `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`; }

function toggleSettings() {
  const banner = document.getElementById('setup-banner');
  const isShowing = banner.classList.contains('show');
  if (!isShowing) {
    // pre-fill ค่าที่บันทึกไว้แล้ว
    document.getElementById('script-url-inp').value = SCRIPT_URL || '';
    document.getElementById('api-key-inp').value = API_KEY || '';
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }
}

function saveConfig() {

function setSyncUI(state, label) {
  document.getElementById('sync-btn').className = 'sync-btn ' + state;
  document.getElementById('sync-label').textContent = label;
}

async function loadFromSheet() {
  if (!SCRIPT_URL) { loadLocal(); return false; }
  setSyncUI('syncing','⏳ โหลด...');
  document.getElementById('conn-status').textContent = '⏳ กำลังซิงค์...';
  try {
    const res  = await fetch(SCRIPT_URL + '?action=read&t=' + Date.now());
    const json = await res.json();
    if (json.status === 'ok' && json.data) {
      tasks    = json.data.tasks    || [];
      projects = json.data.projects || projects;
      const t  = new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
      setSyncUI('ok', `✅ ${t}`);
      document.getElementById('conn-status').textContent = `🟢 ซิงค์แล้ว ${t}`;
      saveLocal();
      renderAll();
      return true;
    }
  } catch(e) { console.warn('Sheet load failed:', e); }
  loadLocal();
  setSyncUI('err','⚠️ Local');
  document.getElementById('conn-status').textContent = '🟡 ใช้ข้อมูล Local';
  return false;
}

function loadLocal() {
  try {
    const d = JSON.parse(localStorage.getItem('aisec-data') || '{}');
    if (d.tasks)    tasks    = d.tasks;
    if (d.projects) projects = d.projects;
  } catch(e) {}
  renderAll();
}

function saveLocal() {
  localStorage.setItem('aisec-data', JSON.stringify({tasks, projects}));
}

async function saveToSheet() {
  saveLocal();
  if (!SCRIPT_URL) return;
  setSyncUI('syncing','⏳ บันทึก...');
  try {
    // ส่งผ่าน GET parameter แทน POST เพื่อหลีกเลี่ยง CORS
    const payload = encodeURIComponent(JSON.stringify({tasks, projects}));
    const res  = await fetch(SCRIPT_URL + '?action=write&payload=' + payload);
    const json = await res.json();
    if (json.status === 'ok') {
      const t = new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
      setSyncUI('ok', `✅ ${t}`);
    } else {
      setSyncUI('err','⚠️ บันทึกไม่สำเร็จ');
    }
  } catch(e) {
    setSyncUI('err','⚠️ Local only');
  }
}

function scheduleSave() {
  saveLocal();
  clearTimeout(syncTimer);
  syncTimer = setTimeout(saveToSheet, 2000);
}

async function syncNow() { await loadFromSheet(); }

function addTaskUI() {

function addTask(text, prio='mid', deadline=null, projId=null) {
  const t = {
    id: Date.now(), text, prio, deadline, projId,
    done: false, doneAt: null,
    created: new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}),
    createdDate: todayStr
  };
  tasks.unshift(t); renderAll(); scheduleSave(); return t;
}

function markDone(id) {
  const t = tasks.find(x=>x.id===id); if (!t) return;
  t.done  = !t.done;
  t.doneAt = t.done
    ? new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}) : null;
  renderAll(); scheduleSave();
}

function deleteTask(id) {
  tasks = tasks.filter(x=>x.id!==id); renderAll(); scheduleSave();
}

function addProjectUI() {
  const inp  = document.getElementById('proj-inp');
  const name = inp.value.trim(); if (!name) return;
  if (!projects.find(p=>p.name===name))
    projects.push({id:Date.now(), name, color:selColor});
  inp.value = ''; renderAll(); scheduleSave();
}

function deleteProject(id) {
  projects = projects.filter(p=>p.id!==id);
  tasks.forEach(t=>{ if(t.projId===id) t.projId=null; });
  renderAll(); scheduleSave();
}

function dlStatus(dl) {
  if (!dl) return null;
  if (dl < todayStr) return 'late';
  if (dl === todayStr) return 'today';
  return (new Date(dl)-new Date(todayStr))/86400000 <= 2 ? 'soon' : 'ok';
}
function dlLabel(dl) {
  if (!dl) return '';
  if (dl === todayStr) return '⚠️ ครบกำหนดวันนี้';
  if (dl < todayStr)  return '🔴 เกินกำหนด ' + dl;
  return '📅 อีก ' + Math.round((new Date(dl)-new Date(todayStr))/86400000) + ' วัน';
}

function renderAll() {
  renderStats(); renderTaskList(); renderProjects(); renderDoneList(); renderProjSelect();
}

function renderStats() {
  const p = tasks.filter(t=>!t.done), d = tasks.filter(t=>t.done);
  const late = p.filter(t=>t.deadline&&t.deadline<todayStr).length;
  const pct  = tasks.length > 0 ? Math.round(d.length/tasks.length*100) : 0;
  document.getElementById('s-total').textContent = tasks.length;
  document.getElementById('s-pend').textContent  = p.length;
  document.getElementById('s-done').textContent  = d.length;
  document.getElementById('s-late').textContent  = late;
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('prog-txt').textContent =
    tasks.length===0 ? 'ยังไม่มีงาน' : `${d.length}/${tasks.length} เสร็จ (${pct}%)`;
}

function taskCard(t) {
  const proj = t.projId ? projects.find(p=>p.id===t.projId) : null;
  const st   = dlStatus(t.deadline);
  const dlCls = st==='late'?'late': st==='today'||st==='soon'?'soon':'';
  return `<div class="task-item ${st==='late'?'overdue':st==='today'?'due-today':''}">
    <div class="cb ${t.done?'done':''}" onclick="markDone(${t.id})"></div>
    <div class="task-body">
      <div class="task-txt ${t.done?'x':''}">${t.text}</div>
      <div class="task-meta">
        <span class="tag tag-${{high:'high',mid:'mid',low:'low'}[t.prio]}">
          ${{high:'🔴 สำคัญ',mid:'🟡 กลาง',low:'🟢 ต่ำ'}[t.prio]}</span>
        ${proj ? `<span class="tag-proj" style="background:${proj.color}18;color:${proj.color};padding:2px 6px;border-radius:4px;font-size:10px;font-weight:500">📁 ${proj.name}</span>` : ''}
        ${t.deadline ? `<span class="tag-dl ${dlCls}">${dlLabel(t.deadline)}</span>` : ''}
      </div>
    </div>
    <button class="btn-del" onclick="deleteTask(${t.id})">×</button>
  </div>`;
}

function renderTaskList() {
  const wrap = document.getElementById('task-list-wrap');
  const pend = tasks.filter(t=>!t.done).sort((a,b)=>{
    const pmap={high:0,mid:1,low:2};
    const dlA=a.deadline||'9999', dlB=b.deadline||'9999';
    return dlA!==dlB ? (dlA<dlB?-1:1) : pmap[a.prio]-pmap[b.prio];
  });
  if (!pend.length) { wrap.innerHTML='<div class="empty-state">✨ ไม่มีงานค้าง<br>เยี่ยมมากครับ!</div>'; return; }
  const late  = pend.filter(t=>t.deadline&&t.deadline<todayStr);
  const today = pend.filter(t=>t.deadline===todayStr);
  const other = pend.filter(t=>!t.deadline||t.deadline>todayStr);
  let h = '';
  if (late.length)  h += `<div class="grp-label"><span>🔴 เกินกำหนด</span><span class="grp-count">${late.length}</span></div>${late.map(taskCard).join('')}`;
  if (today.length) h += `<div class="grp-label"><span>⚠️ วันนี้</span><span class="grp-count">${today.length}</span></div>${today.map(taskCard).join('')}`;
  if (other.length) h += `<div class="grp-label"><span>📋 งานที่เหลือ</span><span class="grp-count">${other.length}</span></div>${other.map(taskCard).join('')}`;
  wrap.innerHTML = h;
}

function renderDoneList() {
  const wrap = document.getElementById('done-list-wrap');
  const done = tasks.filter(t=>t.done).sort((a,b)=>b.id-a.id);
  if (!done.length) { wrap.innerHTML='<div class="empty-state">ยังไม่มีงานที่เสร็จ</div>'; return; }
  wrap.innerHTML = `<div class="grp-label"><span>✅ เสร็จแล้ว</span><span class="grp-count">${done.length}</span></div>` + done.map(taskCard).join('');
}

function renderProjects() {
  buildColorPick();
  const wrap = document.getElementById('proj-list-wrap');
  if (!projects.length) { wrap.innerHTML='<div class="empty-state">ยังไม่มีโปรเจกต์<br>บอก AI หรือสร้างด้วยตัวเองได้เลย</div>'; return; }
  wrap.innerHTML = projects.map(p => {
    const pt    = tasks.filter(t=>t.projId===p.id);
    const pdone = pt.filter(t=>t.done).length;
    const pct   = pt.length > 0 ? Math.round(pdone/pt.length*100) : 0;
    return `<div class="proj-item">
      <div class="proj-dot" style="background:${p.color}"></div>
      <div style="flex:1;min-width:0">
        <div class="proj-name">${p.name}</div>
        <div style="height:3px;background:var(--bg4);border-radius:99px;margin-top:4px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${p.color};border-radius:99px;transition:width .4s"></div>
        </div>
      </div>
      <span class="proj-progress">${pdone}/${pt.length}</span>
      <button class="btn-del-proj" onclick="deleteProject(${p.id})">×</button>
    </div>`;
  }).join('');
}

function buildCtx() {
  const pend  = tasks.filter(t=>!t.done).sort((a,b)=>{const p={high:0,mid:1,low:2};return p[a.prio]-p[b.prio];});
  const done  = tasks.filter(t=>t.done);
  const late  = pend.filter(t=>t.deadline&&t.deadline<todayStr);
  const today = pend.filter(t=>t.deadline===todayStr);
  const pm    = Object.fromEntries(projects.map(p=>[p.id,p.name]));
  const fmt   = t => `• ${t.text} (${{high:'🔴สำคัญ',mid:'🟡กลาง',low:'🟢ต่ำ'}[t.prio]}${t.deadline?` กำหนด:${t.deadline}${t.deadline<todayStr?' ⚠️เกิน':''}`:'' }${t.projId&&pm[t.projId]?' [โปรเจกต์:'+pm[t.projId]+']':''})`; 
  const projSum = projects.map(p=>{
    const pt=tasks.filter(t=>t.projId===p.id);
    const pd=pt.filter(t=>t.done);
    const pp=pt.filter(t=>!t.done);
    return `📁 ${p.name}: ${pd.length}/${pt.length} เสร็จ | ค้าง: ${pp.length?pp.map(t=>t.text).join(', '):'(ไม่มี)'}`;
  }).join('\n');
  return `=== ข้อมูลงานปัจจุบัน ===
วันที่: ${nowD.toLocaleDateString('th-TH',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}
งานค้าง (${pend.length}):
${pend.length ? pend.map(fmt).join('\n') : '(ไม่มี)'}
เกินกำหนด: ${late.length ? late.map(t=>t.text).join(', ') : '(ไม่มี)'}
ครบกำหนดวันนี้: ${today.length ? today.map(t=>t.text).join(', ') : '(ไม่มี)'}
เสร็จแล้ว (${done.length}): ${done.length ? done.slice(0,8).map(t=>t.text).join(', ') : '(ยังไม่มี)'}
โปรเจกต์ (${projects.length}):
${projects.length ? projSum : '(ยังไม่มีโปรเจกต์)'}`;
}

const SYS = `คุณคือ AI Secretary ผู้ช่วยเลขาส่วนตัวภาษาไทย มืออาชีพ ฉลาด ใส่ใจรายละเอียด

COMMANDS (ใส่ท้ายข้อความ ใช้หลายคำสั่งพร้อมกันได้):

── งาน ──
[ADD_HIGH:ชื่องาน:YYYY-MM-DD:ชื่อโปรเจกต์]  (deadline หรือ โปรเจกต์ ใส่ - ถ้าไม่มี)
[ADD_MID:ชื่องาน:deadline:โปรเจกต์]
[ADD_LOW:ชื่องาน:deadline:โปรเจกต์]
[DONE:ชื่องาน]

── โปรเจกต์ ──
[NEW_PROJ:ชื่อโปรเจกต์:สีhex]
[DEL_PROJ:ชื่อโปรเจกต์]

── อื่นๆ ──
[REMIND:ข้อความเตือน]

ตัวอย่าง:
"สร้างโปรเจกต์สำนวนคดีที่ 7 มีงาน 4 อย่าง" →
[NEW_PROJ:สำนวนคดีที่ 7:#6c63ff]
[ADD_HIGH:สอบปากคำลูกจ้าง:-:สำนวนคดีที่ 7]
[ADD_HIGH:สอบปากคำนายจ้าง:-:สำนวนคดีที่ 7]
[ADD_MID:ออกคำสั่ง:-:สำนวนคดีที่ 7]
[ADD_MID:ส่งหนังสือทางไปรษณีย์:-:สำนวนคดีที่ 7]

กฎ:
1. บอกเสร็จ → ตอบรับ + [DONE:งาน]
2. บอกงานใหม่ → [ADD_xxx:งาน:deadline:โปรเจกต์]
3. สร้างโปรเจกต์ → [NEW_PROJ:...] แล้วตาม [ADD_xxx:...:...:โปรเจกต์]
4. ถามความคืบหน้าโปรเจกต์ → สรุปจากข้อมูลที่ได้รับ
5. ถามลำดับ → วิเคราะห์ deadline+priority แนะนำเป็นข้อๆ
6. มีงานเกินกำหนด → แจ้ง + [REMIND:...]
7. พูดไทยธรรมชาติ กระชับ ใช้ emoji พอดี`;

async function sendMsg() {
  if (busy) return;
  if (!API_KEY) {
    appendMsg('ai', '⚠️ ยังไม่ได้ตั้งค่า API Key ครับ กรุณากรอกใน Setup Banner ด้านซ้ายก่อน');
    document.getElementById('setup-banner').classList.add('show');
    return;
  }
  const ta   = document.getElementById('chat-ta');
  const text = ta.value.trim(); if (!text) return;
  ta.value = ''; ta.style.height = '';
  appendMsg('user', text);
  busy = true; document.getElementById('btn-send').disabled = true; showTyping();

  try {
    const res  = await fetch(geminiURL(), {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: SYS }] },
        contents: [{ role:'user', parts:[{ text: text + '\n\n' + buildCtx() }] }],
        generationConfig: { maxOutputTokens: 1500, temperature: 0.7 }
      })
    });
    const data = await res.json(); hideTyping();
    let reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'ขออภัยครับ เกิดข้อผิดพลาด';

    // NEW_PROJ
    const npRx = /\[NEW_PROJ:([^:\]]+):([^\]]*)\]/g; let m;
    while ((m=npRx.exec(reply))!==null) {
      const name=m[1].trim(), color=m[2].trim()||'#6c63ff';
      if (!projects.find(p=>p.name===name)) { projects.push({id:Date.now(),name,color}); renderAll(); scheduleSave(); }
      reply = reply.replace(m[0], `<span class="hi-g">📁 สร้างโปรเจกต์: "${name}"</span>`);
    }
    // ADD (4 params)
    const addRx = /\[ADD_(HIGH|MID|LOW):([^:\]]+):([^:\]]*):([^\]]*)\]/g;
    while ((m=addRx.exec(reply))!==null) {
      const prio=m[1].toLowerCase(), name=m[2].trim();
      const dl=m[3].trim()==='-'||!m[3].trim()?null:m[3].trim();
      const pjName=m[4].trim()==='-'||!m[4].trim()?null:m[4].trim();
      const proj=pjName?projects.find(p=>p.name===pjName):null;
      addTask(name, prio, dl, proj?proj.id:null);
      reply = reply.replace(m[0], `<span class="hi-g">✅ เพิ่มงาน: "${name}"${pjName&&proj?' → '+pjName:''}${dl?' (ส่ง '+dl+')':''}</span>`);
    }
    // ADD legacy (3 params)
    const addRx2 = /\[ADD_(HIGH|MID|LOW):([^:\]]+):([^\]]*)\]/g;
    while ((m=addRx2.exec(reply))!==null) {
      const prio=m[1].toLowerCase(), name=m[2].trim(), dl=m[3].trim()==='-'||!m[3].trim()?null:m[3].trim();
      addTask(name, prio, dl, null);
      reply = reply.replace(m[0], `<span class="hi-g">✅ เพิ่มงาน: "${name}"${dl?' (ส่ง '+dl+')':''}</span>`);
    }
    // DONE
    const doneRx = /\[DONE:([^\]]+)\]/g;
    while ((m=doneRx.exec(reply))!==null) {
      const name=m[1].trim();
      const found=tasks.find(t=>!t.done&&(t.text.toLowerCase().includes(name.toLowerCase())||name.toLowerCase().includes(t.text.toLowerCase().substring(0,8))));
      if (found) { found.done=true; found.doneAt=getTime(); renderAll(); scheduleSave(); }
      reply = reply.replace(m[0], '<span class="hi-g">✓ บันทึกแล้ว</span>');
    }
    // REMIND
    const remRx = /\[REMIND:([^\]]+)\]/g;
    while ((m=remRx.exec(reply))!==null) { showReminder(m[1].trim()); reply=reply.replace(m[0],''); }
    // DEL_PROJ
    const dpRx = /\[DEL_PROJ:([^\]]+)\]/g;
    while ((m=dpRx.exec(reply))!==null) {
      const proj=projects.find(p=>p.name===m[1].trim());
      if (proj) deleteProject(proj.id);
      reply = reply.replace(m[0], `<span class="hi-a">🗑 ลบโปรเจกต์: "${m[1].trim()}"</span>`);
    }

    reply = reply.replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    appendMsg('ai', reply);
  } catch(e) {
    hideTyping();
    appendMsg('ai', 'ขออภัยครับ เชื่อมต่อ Gemini API ไม่ได้ — กรุณาตรวจสอบ API Key');
  }
  busy = false; document.getElementById('btn-send').disabled = false;
}

function qs(t) { document.getElementById('chat-ta').value=t; sendMsg(); }

document.getElementById('task-inp').addEventListener('keydown', e=>{ if(e.key==='Enter') addTaskUI(); });
document.getElementById('proj-inp').addEventListener('keydown', e=>{ if(e.key==='Enter') addProjectUI(); });
document.getElementById('chat-ta').addEventListener('keydown', e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();} });
document.getElementById('chat-ta').addEventListener('input', function(){ this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,110)+'px'; });
